metadata:
  technology_inputs_name: "belgian_residential_technology_inputs"
  baseline_year: 2024
  geography:
    country: "Belgium"
    regions: ["Flanders", "Wallonia", "Brussels-Capital Region"]
  provenance_note: "Compiled from the DeepSearch technology-input memo. Carrier stock evidence is stronger than appliance-resolved stock evidence."
  uncertainty_note: "Ranges marked as assumptions are scenario parameters, not observed Belgian stock distributions."

technology_sources:
  heating_stock_barometer_2024:
    source_name: "Barometre de la precarite energetique 2024"
    source_url: "https://media.kbs-frb.be/fr/media/11814/Barom%C3%A8tre%20de%20la%20Pr%C3%A9carit%C3%A9%20Energ%C3%A9tique%202024"
    reference_year: 2022
    geography: "Belgium"
    suitability: "Strong for household main-heating carrier shares; not appliance-resolved."
  jrc_heat_pump_market_belgium:
    source_name: "JRC Country fiche: Belgium - Status of the Heat Pump Market"
    source_url: "https://publications.jrc.ec.europa.eu/repository/bitstream/JRC137131/JRC137131_002.pdf"
    reference_year: 2022
    geography: "Belgium"
    suitability: "Useful for gas-boiler households and heat-pump installed stock."
  country_report_belgium_rap:
    source_name: "Country Report Belgium"
    source_url: "https://www.raponline.org/wp-content/uploads/2024/10/Countryreport_Belgium.pdf"
    reference_year: 2020
    geography: "Belgium"
    suitability: "Good for DHW caveats, gas DHW share, condensing boiler sales, and district-heating context."
  ku_leuven_hp_performance:
    source_name: "KU Leuven working paper on Belgian residential heat pumps"
    source_url: "https://www.mech.kuleuven.be/en/tme/research/energy_environment/pdf/wp-2015-08.pdf"
    reference_year: 2015
    geography: "Belgian context"
    suitability: "Good for Belgian heat-pump SPF ranges by emitter and renovation state."
  iea_pvps_belgium_2024:
    source_name: "IEA PVPS Belgium 2024 national survey page"
    source_url: "https://iea-pvps.org/national_survey/nsr-belgium-2024/"
    reference_year: 2024
    geography: "Belgium"
    suitability: "Strong for national cumulative PV capacity and residential small-scale market structure."
  brugel_annual_report_2024:
    source_name: "BRUGEL Annual Report 2024"
    source_url: "https://brugel.brussels/publication/document/rapports/2025/fr/Rapport-Annuel-2024-BRUGEL.pdf"
    reference_year: 2024
    geography: "Brussels-Capital Region"
    suitability: "Strong regional PV installation and capacity anchor."
  statbel_electric_vehicle_stock_2025:
    source_name: "Statbel electric boom in Belgium"
    source_url: "https://statbel.fgov.be/en/news/electric-boom-belgium-55-cars-one-year"
    reference_year: 2025
    geography: "Belgium"
    suitability: "Strong for BEV stock and private/company registration split."
  statbel_household_car_ownership_2024:
    source_name: "Statbel vehicles per household"
    source_url: "https://statbel.fgov.be/en/themes/mobility/traffic/vehicles-household"
    reference_year: 2024
    geography: "Belgium"
    suitability: "Strong for household car ownership conditioning."
  federal_carbon_energy_pricing_2025:
    source_name: "Landscape of carbon and energy taxation"
    source_url: "https://climat.be/doc/2025-landscape-of-carbon-and-energy-taxation.pdf"
    reference_year: 2025
    geography: "Belgium"
    suitability: "Official modelling assumptions for EV annual distance and electricity intensity."
  crm_battery_monitoring_2025:
    source_name: "CRM Monitoring Report / Belgian electricity market implementation plan 2025"
    source_url: "https://economie.fgov.be/sites/default/files/Files/Energy/CRM-Monitoring-Report-Belgian-electricity-market-Implementation-plan-2025.pdf"
    reference_year: "2024-06"
    geography: "Flanders"
    suitability: "Strong for Flemish home-battery stock and capacity."
  energuide_home_battery:
    source_name: "Energuide home-battery page"
    source_url: "https://www.energuide.be/en/questions-answers/is-it-worth-investing-in-a-home-battery/2137/"
    reference_year: "current market"
    geography: "Belgium"
    suitability: "Useful public-information range for household battery sizing and self-consumption effects."

technologies:
  heating:
    stock_baseline:
      source_type: "observed_carrier_shares_plus_mapping_assumptions"
      source_keys:
        - "heating_stock_barometer_2024"
        - "jrc_heat_pump_market_belgium"
        - "country_report_belgium_rap"
      variables:
        main_space_heating_share:
          belgium:
            gas: 0.637
            heating_oil: 0.211
            direct_electric_excl_hp: 0.069
            wood_pellet: 0.050
            heat_pump: 0.015
            propane_butane: 0.008
            coal: 0.005
          flanders:
            gas: 0.712
            heating_oil: 0.147
          wallonia:
            gas: 0.424
            heating_oil: 0.375
          brussels:
            gas: 0.860
            heating_oil: 0.075
        gas_boiler_households:
          value: 2800000
          unit: "households"
          reference_year: 2022
          source_key: "jrc_heat_pump_market_belgium"
        heat_pump_stock_units:
          value: 209000
          unit: "units"
          reference_year: 2022
          source_key: "jrc_heat_pump_market_belgium"
        district_heating_end_use_share:
          value: 0.005
          unit: "share of heating end use"
          source_key: "country_report_belgium_rap"
    mapping_assumptions:
      gas:
        technologies:
          gas_boiler: 0.98
          hybrid_hp_gas: 0.02
        assumption_flag: true
      heating_oil:
        technologies:
          oil_boiler: 0.95
          oil_stove_other: 0.05
        assumption_flag: true
      direct_electric_excl_hp:
        technologies:
          resistive_direct: 0.70
          storage_heater: 0.30
        assumption_flag: true
      wood_pellet:
        technologies:
          biomass_stove: 0.80
          biomass_boiler: 0.20
        assumption_flag: true
      heat_pump:
        technologies:
          air_water: 0.60
          air_air: 0.30
          ground_source: 0.10
        assumption_flag: true
      propane_butane:
        technologies:
          propane_boiler: 1.00
        assumption_flag: true
      coal:
        technologies:
          coal_stove: 1.00
        assumption_flag: true
    performance:
      gas_boiler:
        seasonal_efficiency:
          low: 0.85
          base: 0.90
          high: 0.95
          source_key: "ku_leuven_hp_performance"
          assumption_flag: true
      oil_boiler:
        seasonal_efficiency:
          low: 0.75
          base: 0.82
          high: 0.90
          assumption_flag: true
      heat_pump:
        air_water_radiators_spf:
          low: 2.3
          base: 2.5
          high: 2.6
          source_key: "ku_leuven_hp_performance"
        air_water_low_temp_spf:
          low: 2.5
          base: 2.7
          high: 3.0
          source_key: "ku_leuven_hp_performance"
        ground_source_low_temp_spf:
          low: 3.3
          base: 3.6
          high: 4.0
          source_key: "ku_leuven_hp_performance"
        high_temp_retrofit_spf:
          low: 1.8
          base: 1.95
          high: 2.1
          source_key: "ku_leuven_hp_performance"
      biomass:
        efficiency:
          low: 0.65
          base: 0.75
          high: 0.85
          assumption_flag: true
      hybrid_hp:
        control:
          dhw_by_boiler: true
          hp_capacity_fraction: 0.65
          hp_min_outdoor_temperature_C: -5.0
          hp_min_cop: 2.5
          hp_max_sink_temperature_C: 55.0
          control_note: "Minimum bivalent-parallel control: heat pump runs only when outdoor temperature, current COP, sink temperature, and available capacity are within defensible operating bounds; gas boiler supplies residual or lockout heat."
      district_heating:
        dwelling_conversion:
          low: 1.0
          base: 1.0
          high: 1.0

  dhw:
    stock_baseline:
      gas_share:
        value: 0.59
        unit: "share of households"
        reference_year: 2020
        source_key: "country_report_belgium_rap"
      explicit_data_gaps:
        - "No clean Belgium-wide numerical split located for electric DHW, HPWH, oil, district heat, or solar thermal."
    modelling_assumptions:
      link_to_space_heating_carrier_by_default: true
      standalone_electric_storage_extra_share:
        low: 0.10
        base: 0.15
        high: 0.20
        assumption_flag: true
      solar_thermal_share:
        low: 0.00
        base: 0.01
        high: 0.03
        assumption_flag: true
      hpwh_share:
        low: 0.00
        base: 0.01
        high: 0.03
        assumption_flag: true

der:
  pv:
    enabled: false
    stock_baseline:
      belgium_total_capacity_gwp:
        value: 11.7
        reference_year: 2024
        source_key: "iea_pvps_belgium_2024"
      belgium_new_capacity_2024_gwp:
        low: 0.98
        base: 1.20
        high: 1.40
        source_key: "iea_pvps_belgium_2024"
      brussels_installations:
        value: 24117
        reference_year: 2024
        source_key: "brugel_annual_report_2024"
      brussels_capacity_mwp:
        value: 310
        reference_year: 2024
        source_key: "brugel_annual_report_2024"
      brussels_household_penetration_proxy:
        value: 0.22
        reference_year: 2024
        source_key: "brugel_annual_report_2024"
    adoption:
      household_probability:
        low: 0.20
        base: 0.30
        high: 0.35
        assumption_flag: true
        note: "Capacity-derived Belgian household penetration proxy; not a directly observed national household count."
      calibration_target: "national installed capacity plus regional installation counts"
    system_size_kwp:
      low: 4.0
      base: 6.0
      high: 10.0
      assumption_flag: true
    orientation: "south"
    yield:
      method: "PVGIS_hourly_preferred"
      fallback_specific_yield_kwh_per_kwp_year:
        low: 800
        base: 950
        high: 1000
        assumption_flag: true
    self_consumption_without_battery:
      low: 0.30
      base: 0.50
      high: 0.60
      assumption_flag: true
    inverter_efficiency:
      low: 0.96
      base: 0.97
      high: 0.98
      assumption_flag: true

  battery:
    enabled: false
    stock_baseline:
      flanders_units_2024_06:
        value: 127633
        source_key: "crm_battery_monitoring_2025"
      flanders_capacity_mwh_2024_06:
        value: 1122
        source_key: "crm_battery_monitoring_2025"
      flanders_average_capacity_kwh:
        value: 8.8
        source_key: "crm_battery_monitoring_2025"
    adoption:
      conditional_on_pv: true
      calibration_target: "regional battery stock where observable"
      assumption_flag: true
    usable_capacity_kwh:
      low: 3.0
      base: 8.0
      high: 20.5
      source_key: "energuide_home_battery"
    inverter_power_kw:
      low: 5.0
      base: 5.5
      high: 6.0
      source_key: "energuide_home_battery"
    round_trip_efficiency:
      low: 0.90
      base: 0.92
      high: 0.95
      assumption_flag: true
    control:
      objective: "self_consumption_maximisation"
      self_consumption_with_battery:
        low: 0.60
        base: 0.70
        high: 0.80
        source_key: "energuide_home_battery"

mobility:
  ev:
    enabled: false
    stock_baseline:
      bev_total_cars:
        value: 395188
        reference_year: 2025
        source_key: "statbel_electric_vehicle_stock_2025"
      bev_private_cars:
        value: 71371
        reference_year: 2025
        source_key: "statbel_electric_vehicle_stock_2025"
      bev_company_share:
        value: 0.818
        reference_year: 2025
        source_key: "statbel_electric_vehicle_stock_2025"
      hybrid_total_cars:
        value: 846354
        reference_year: 2025
        source_key: "statbel_electric_vehicle_stock_2025"
      hybrid_private_share:
        value: 0.513
        reference_year: 2025
        source_key: "statbel_electric_vehicle_stock_2025"
    household_conditioning:
      households_with_at_least_one_car:
        value: 0.72
        reference_year: 2024
        source_key: "statbel_household_car_ownership_2024"
      regional:
        brussels:
          value: 0.436
          reference_year: 2024
          source_key: "statbel_household_car_ownership_2024"
    ownership:
      household_probability:
        low: 0.010
        base: 0.014
        high: 0.020
        assumption_flag: true
        note: "Lower-bound proxy from private BEV stock divided by private households; excludes uncertain company-EV household access."
      use_total_bev_stock_directly_for_households: false
      calibrate_to:
        - "private EV stock as lower bound"
        - "scenario share of company cars available to households"
      data_gap: "Household access to company EVs and home charging is not directly observed here."
    annual_use:
      km_per_year:
        low: 12000
        base: 15000
        high: 18000
        source_key: "federal_carbon_energy_pricing_2025"
      specific_consumption_kwh_per_100km:
        low: 13.0
        base: 14.2
        high: 16.0
        source_key: "federal_carbon_energy_pricing_2025"
    charging:
      home_charging_probability:
        low: 0.50
        base: 0.70
        high: 0.85
        assumption_flag: true
      charger_power_kw:
        low: 3.7
        base: 7.4
        high: 11.0
        assumption_flag: true
      uncontrolled_arrival_window:
        start_hour: 17
        end_hour: 22
        assumption_flag: true
      charging_strategy: "delayed_overnight_home"
      charging_window:
        start_hour: 22
        end_hour: 6
        assumption_flag: true
        note: "Minimum calibration update from Fluvius EV signature validation; represents delayed residential home charging, not session-level evidence."
      charging_shape: "gaussian"
      peak_hour: 1
      profile_spread_hours:
        base: 1.8
        assumption_flag: true
      peak_jitter_sigma_hours:
        base: 1.25
        assumption_flag: true
      peak_jitter_max_hours:
        base: 3.0
        assumption_flag: true
