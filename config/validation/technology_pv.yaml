runner:
  name: technology_pv
  description: PV validation triangle against PVGIS, Elia ODS032, and optional Fluvius PV signature.
  timeout_seconds: 600
  command:
    - "{python}"
    - "-m"
    - "model_v3.validation.technology.pv.run_pv_validation_triangle"
    - "--repo-root"
    - "{repo_root}"
    - "--config"
    - "config/validation/technology_pv.yaml"
    - "--print-summary"
  quick_args:
    - "--skip-fluvius"
    - "--report-dir"
    - "outputs/validation/debug/technology_pv/reports"
    - "--figure-dir"
    - "outputs/validation/debug/technology_pv/figures"
  full_args: []
  quick_expected_artifacts:
    - "outputs/validation/debug/technology_pv/reports/technology_pv_validation_triangle_report.md"
    - "outputs/validation/debug/technology_pv/reports/technology_pv_validation_triangle_metrics.json"
  full_expected_artifacts:
    - "reports/model_v3/validation/technology/pv/technology_pv_validation_triangle_report.md"
    - "reports/model_v3/validation/technology/pv/technology_pv_validation_triangle_metrics.json"

validation:
  technology:
    pv:
      pvgis:
        reference_alignment_file: reports/model_v3/validation/technology/pv/pvgis_reference_alignment.csv
        model_capacity_factor_file: outputs/validation/technology_pv/model_capacity_factor_2023.csv
        model_capacity_factor_year: 2023
        reference_globs:
          - model_v3/validation/pvgis/*.csv
          - validation/pvgis/*.csv
          - outputs/validation/pvgis/*.csv
          - inputs/validation/pv/pvgis/*.csv
        capacity_kwp: 1.0
        performance_ratio: 0.86
        power_column_candidates:
          - P
          - pv_power_W
          - P_W
        irradiance_column_candidates:
          - G(i)
          - G_i
          - poa_irradiance_W_m2
          - global_in_plane_W_m2
      elia:
        url: "https://opendata.elia.be/api/explore/v2.1/catalog/datasets/ods032/exports/csv?select=datetime,resolutioncode,region,measured,monitoredcapacity,loadfactor&where=resolutioncode%20%3D%20%22PT15M%22%20AND%20datetime%20%3E%3D%20date%272023-01-01T00%3A00%3A00%27%20AND%20datetime%20%3C%20date%272024-01-01T00%3A00%3A00%27&refine=region%3ABelgium&order_by=datetime%20ASC&timezone=Europe%2FBrussels&use_labels=false&delimiter=%3B"
        local_file: inputs/validation/pv/elia/ods032_belgium_pv_2023_pt15m.csv
        download_if_missing: true
        model_capacity_factor_file: outputs/validation/technology_pv/model_capacity_factor_2023.csv
      fluvius:
        enabled: true
        no_pv_file: inputs/load_profiles/fluvius/P6269_Open_Data_geen_ZP.csv
        pv_file: inputs/load_profiles/fluvius/P6269_Open_Data_enkel_ZP.csv
        model_net_load_file: outputs/validation/technology_pv/model_net_load_2023.csv
        model_config_file: config/thesis.yaml
        model_pv_system_size_kwp: 6.0
        generate_model_net_load_if_missing: true
      outputs:
        report_dir: reports/model_v3/validation/technology/pv
        figure_dir: figures/model_v3/validation/technology/pv
