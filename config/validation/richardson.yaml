runner:
  name: richardson
  description: Stochastic baseload validation against Richardson-style profiles.
  timeout_seconds: 900
  command:
    - "{python}"
    - "-m"
    - "model_v3.validation.runners.validate_against_richardson"
    - "--config"
    - "config/thesis.yaml"
    - "--allow-fallback"
  quick_args:
    - "--quick"
  full_args: []
  expected_artifacts:
    - "outputs/validation/richardson/richardson_validation_report.md"
    - "outputs/validation/richardson/metrics.json"
